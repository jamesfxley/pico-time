family = "infra"

[house]
platform = "infra/house"
languages = ["cxx"]
licence = "MIT"

[packages.root]
path = "."
[packages.root.modes]
host = "build-test"
firmware = "build-install"

[[packages.root.consumer_cases]]
name = "host-install-refused"
tree = "host"
producer_args = ["-DPICO_TIME_ENABLE_INSTALL=ON"]
expect = "fails"
stage = "producer-configure"
message = "PICO_TIME_ENABLE_INSTALL requires a firmware configure"

[[packages.root.consumer_cases]]
name = "pico-w-refused"
tree = "firmware"
source = "tests/consumer-board"
consumer_args = ["-DPICO_BOARD=pico_w"]
expect = "fails"
stage = "consumer-configure"
message = "PICO_TIME needs PICO_PLATFORM rp2350"

[[packages.root.consumer_cases]]
name = "pico2-refused"
tree = "firmware"
source = "tests/consumer-board"
consumer_args = ["-DPICO_BOARD=pico2"]
expect = "fails"
stage = "consumer-configure"
message = "PICO_TIME needs a board with the CYW43 radio"

[[packages.root.consumer_cases]]
name = "lwipopts-required"
tree = "firmware"
producer_args = ["-DPICO_LWIPOPTS_TARGET="]
expect = "fails"
stage = "producer-configure"
message = "PICO_LWIPOPTS_TARGET must name the target"

[ci.axes]
lwipopts = "PICO_LWIPOPTS_TARGET"
ssid = "PICO_TIME_WIFI_SSID"
password = "PICO_TIME_WIFI_PASSWORD"

[[ci.require]]
group = "build"
matrix = { build_type = ["Debug", "Release"], sanitize = ["ON"], lwipopts = ["pico_time_lwipopts_fallback"], ssid = ["placeholder-ssid"], password = ["placeholder-password"] }

[[ci.require]]
group = "lint"
matrix = { sanitize = ["ON"], lwipopts = ["pico_time_lwipopts_fallback"], ssid = ["placeholder-ssid"], password = ["placeholder-password"] }
prepare = ["python3 dev.py build"]

[[ci.require]]
group = "firmware"
matrix = { board = ["pico2_w"], lwipopts = ["pico_time_lwipopts_fallback"], ssid = ["placeholder-ssid"], password = ["placeholder-password"] }
prepare = ["python3 dev.py build", "python3 dev.py gate build-warnings"]

[[ci.require]]
group = "consumer"
matrix = { lwipopts = ["pico_time_lwipopts_fallback"] }
